# vpn-admin 的 nginx 配置（容器内使用）
#
# 与宿主上的自编译版本保持同样的行为，只把路径换成容器内的路径：
#   - 站点根目录  /usr/share/nginx/html      （挂载 web/dist）
#   - 证书目录    /etc/nginx/certs           （挂载宿主证书目录）
#   - 上游        http://127.0.0.1:8080     （因 nginx 与 vpn-admin 共用宿主 netns）
#
# /metrics 只允许本机访问：nginx 跑在宿主 netns 里，所以 127.0.0.1 判断依旧成立。

worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 8m;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # HTTP 全部跳转 HTTPS
    server {
        listen       80 default_server;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    # HTTPS：管理前端 + API 反向代理
    server {
        listen       443 ssl default_server;
        http2        on;
        server_name  _;

        ssl_certificate      /etc/nginx/certs/vpn-admin.crt;
        ssl_certificate_key  /etc/nginx/certs/vpn-admin.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        root  /usr/share/nginx/html;
        index index.html;

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /healthz { proxy_pass http://127.0.0.1:8080/healthz; }
        location = /readyz  { proxy_pass http://127.0.0.1:8080/readyz; }

        # Prometheus 指标只允许本机抓取
        location = /metrics {
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://127.0.0.1:8080/metrics;
        }
    }
}