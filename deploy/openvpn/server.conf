# OpenVPN 服务端配置（容器内版本）
#
# 与宿主上的自编译版本行为一致，只把路径改为容器内路径：
#   证书/密钥  /etc/openvpn/          （挂载宿主证书目录，只读）
#   状态文件   /run/openvpn-server/   （与 policyd/admin 共享）
#   认证脚本   /usr/local/sbin/vpn-auth-check
#
# 注意：tunnel_network 必须与 vpn_settings.tunnel_network 保持一致。

port 1194
proto udp
dev tun
topology subnet

ca   /etc/openvpn/certs/ca.crt
cert /etc/openvpn/certs/server.crt
key  /etc/openvpn/certs/server.key
dh none

server 10.9.100.0 255.255.255.0

push "explicit-exit-notify 1"

tls-auth /etc/openvpn/certs/ta.key 0
ncp-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
keepalive 10 120
persist-tun

status /run/openvpn-server/status.log 5
status-version 2

verb 3

# 认证：查自有用户表（vpn_users），不再经过 PAM/RADIUS
auth-user-pass-verify /usr/local/sbin/vpn-auth-check via-file
tmp-dir /dev/shm

script-security 2

client-connect    /usr/local/sbin/vpn-client-connect
client-disconnect /usr/local/sbin/vpn-client-disconnect

verify-client-cert none
username-as-common-name

management /run/openvpn-server/management.sock unix
management-client-user root